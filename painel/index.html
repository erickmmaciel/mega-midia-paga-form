<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mega - Painel de Ads</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding: 40px 16px 80px;
      color: #2c2c2c;
    }
    .wrap { max-width: 1100px; margin: 0 auto; }

    /* ── Header ── */
    .header { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
    .header-logo {
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg, #f857a6, #7b68ee);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #fff; font-weight: 800; flex-shrink: 0;
    }
    .header h1 { font-size: 22px; font-weight: 700; }
    .sub { font-size: 13px; color: #888; margin-bottom: 28px; }
    .sub a { color: #7b68ee; }

    /* ── KPIs ── */
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .kpi {
      background: #fff; border-radius: 12px; padding: 18px 20px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    }
    .kpi-label { font-size: 12px; color: #888; font-weight: 600; }
    .kpi-value { font-size: 26px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }

    /* ── Filtros ── */
    .filters { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    select, input[type="search"] {
      padding: 9px 12px; border: 1px solid #d0d0d0; border-radius: 8px;
      font-size: 14px; font-family: inherit; background: #fff; color: #2c2c2c; outline: none;
    }
    select:focus, input:focus { border-color: #7b68ee; box-shadow: 0 0 0 3px rgba(123,104,238,0.12); }
    input[type="search"] { flex: 1; min-width: 180px; }

    /* ── Lista ── */
    .card {
      background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.06);
      padding: 20px 24px; margin-bottom: 14px;
    }
    .card-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
    .card h2 { font-size: 16px; font-weight: 700; }
    .meta { font-size: 13px; color: #777; margin-top: 4px; }
    .badge {
      font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap;
    }
    .badge.publicado { background: #e8f5e9; color: #2e7d32; }
    .badge.pausado   { background: #eceff1; color: #546e7a; }
    .badge.erro      { background: #ffebee; color: #c62828; }
    .erro-msg { margin-top: 10px; font-size: 13px; color: #c62828; background: #fff5f5; padding: 10px 12px; border-radius: 8px; }

    .contas { margin-top: 14px; display: grid; gap: 10px; }
    .conta {
      border: 1px solid #eee; border-radius: 10px; padding: 12px 14px;
      display: grid; grid-template-columns: 1.6fr repeat(4, 1fr) auto; gap: 10px; align-items: center;
      font-size: 13px;
    }
    .conta .nome { font-weight: 600; word-break: break-word; }
    .num { font-variant-numeric: tabular-nums; }
    .num small { display: block; color: #999; font-size: 11px; font-weight: 600; }
    .links { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .btn {
      font-size: 13px; font-weight: 600; text-decoration: none; padding: 8px 12px;
      border-radius: 8px; border: 1px solid #d0d0d0; color: #2c2c2c; background: #fff; cursor: pointer;
      font-family: inherit;
    }
    .btn.primary { background: #7b68ee; border-color: #7b68ee; color: #fff; }
    .btn:hover { border-color: #7b68ee; }
    .empty { text-align: center; color: #888; padding: 48px 16px; }

    #toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: #323232; color: #fff; padding: 13px 24px; border-radius: 8px; font-size: 14px;
      opacity: 0; transition: opacity 0.3s, transform 0.3s; z-index: 999; max-width: 90vw; text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 760px) {
      .kpis { grid-template-columns: 1fr 1fr; }
      .conta { grid-template-columns: 1fr 1fr; }
      .conta .nome { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="header-logo">M</div>
    <h1>Mega - Painel de Ads</h1>
  </div>
  <p class="sub">
    Campanhas publicadas automaticamente a partir do <a href="../">formulário</a>.
    <span id="atualizado"></span>
  </p>

  <div class="kpis">
    <div class="kpi"><div class="kpi-label">Campanhas ativas</div><div class="kpi-value" id="kAtivas">–</div></div>
    <div class="kpi"><div class="kpi-label">Investido</div><div class="kpi-value" id="kGasto">–</div></div>
    <div class="kpi"><div class="kpi-label">Conversas + leads</div><div class="kpi-value" id="kResultados">–</div></div>
    <div class="kpi"><div class="kpi-label">Com erro</div><div class="kpi-value" id="kErros">–</div></div>
  </div>

  <div class="filters">
    <select id="fProjeto"><option value="">Todos os projetos</option></select>
    <select id="fStatus">
      <option value="">Todos os status</option>
      <option value="publicado">Ativas</option>
      <option value="pausado">Pausadas</option>
      <option value="erro">Com erro</option>
    </select>
    <input type="search" id="fBusca" placeholder="Buscar por responsável, ID ou nome…" />
  </div>

  <div id="lista"><div class="empty">Carregando…</div></div>
</div>

<div id="toast"></div>

<script>
  const ESTADO_URL = '../automacao/estado.json';
  const ACTIONS_URL = 'https://github.com/erickmmaciel/mega-midia-paga-form/actions/workflows/ads-automacao.yml';

  const brl = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const int = v => v.toLocaleString('pt-BR');
  const fmtData = iso => iso ? new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '';
  const fmtDia = ymd => ymd ? ymd.split('-').reverse().join('/') : '';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeUrl = u => /^https:\/\//.test(u || '') ? u : '#';

  let registros = [];

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'show';
    setTimeout(() => { el.className = ''; }, 3500);
  }

  function totais(reg) {
    const t = { gasto: 0, resultados: 0, alcance: 0 };
    for (const c of reg.contas || []) {
      const m = c.metricas || {};
      t.gasto += m.gasto || 0;
      t.resultados += (m.conversas || 0) + (m.leads || 0);
      t.alcance += m.alcance || 0;
    }
    return t;
  }

  function renderKpis() {
    let ativas = 0, gasto = 0, resultados = 0, erros = 0;
    for (const r of registros) {
      if (r.status === 'erro') erros++;
      for (const c of r.contas || []) if (c.status_meta === 'ACTIVE') ativas++;
      const t = totais(r);
      gasto += t.gasto; resultados += t.resultados;
    }
    document.getElementById('kAtivas').textContent = int(ativas);
    document.getElementById('kGasto').textContent = brl(gasto);
    document.getElementById('kResultados').textContent = int(resultados);
    document.getElementById('kErros').textContent = int(erros);
  }

  function contaHtml(c) {
    const m = c.metricas || {};
    return `
      <div class="conta">
        <div class="nome">${esc(c.nome)}<div class="meta">${esc(c.status_meta || 'aguardando sincronização')}</div></div>
        <div class="num"><small>Investido</small>${brl(m.gasto || 0)} / ${brl((c.verba_centavos || 0) / 100)}</div>
        <div class="num"><small>Alcance</small>${int(m.alcance || 0)}</div>
        <div class="num"><small>Cliques</small>${int(m.cliques || 0)}</div>
        <div class="num"><small>Conversas/leads</small>${int((m.conversas || 0) + (m.leads || 0))}</div>
        <a class="btn" href="${esc(safeUrl(c.link))}" target="_blank" rel="noopener">Ads Manager</a>
      </div>`;
  }

  function cardHtml(r) {
    const rotulo = { publicado: 'Ativa', pausado: 'Pausada', erro: 'Erro' }[r.status] || r.status;
    const acao = r.status === 'publicado' ? 'pausar' : r.status === 'pausado' ? 'ativar' : 'publicar';
    return `
      <div class="card">
        <div class="card-top">
          <div>
            <h2>${esc(r.projeto)} · ${esc(r.objetivo)}</h2>
            <div class="meta">
              ${r.responsavel ? `👤 ${esc(r.responsavel)} · ` : ''}até ${esc(fmtDia(r.data_fim))}
              · processado ${esc(fmtData(r.processado_em))} · tarefa #${esc(r.task_id)}
            </div>
          </div>
          <span class="badge ${esc(r.status)}">${esc(rotulo)}</span>
        </div>
        ${r.erro ? `<div class="erro-msg">${esc(r.erro)}</div>` : ''}
        ${(r.contas || []).length ? `<div class="contas">${r.contas.map(contaHtml).join('')}</div>` : ''}
        <div class="links">
          ${r.task_url ? `<a class="btn" href="${esc(safeUrl(r.task_url))}" target="_blank" rel="noopener">Abrir no ClickUp</a>` : ''}
          <button class="btn primary" data-acao="${acao}" data-task="${esc(r.task_id)}">
            ${acao === 'pausar' ? '⏸ Pausar' : acao === 'ativar' ? '▶ Ativar' : '↻ Reprocessar'}
          </button>
        </div>
      </div>`;
  }

  function render() {
    const p = document.getElementById('fProjeto').value;
    const s = document.getElementById('fStatus').value;
    const q = document.getElementById('fBusca').value.trim().toLowerCase();
    const lista = registros.filter(r =>
      (!p || r.projeto === p) &&
      (!s || r.status === s) &&
      (!q || [r.responsavel, r.task_id, ...(r.contas || []).map(c => c.nome)].join(' ').toLowerCase().includes(q)));
    document.getElementById('lista').innerHTML = lista.length
      ? lista.map(cardHtml).join('')
      : '<div class="empty">Nenhuma campanha encontrada.</div>';
  }

  // Ações rodam no GitHub Actions (onde ficam os tokens): copia o ID e abre o "Run workflow".
  document.getElementById('lista').addEventListener('click', async e => {
    const btn = e.target.closest('[data-acao]');
    if (!btn) return;
    try { await navigator.clipboard.writeText(btn.dataset.task); } catch (_) {}
    showToast(`ID ${btn.dataset.task} copiado. Em "Run workflow" escolha "${btn.dataset.acao}" e cole o ID.`);
    window.open(ACTIONS_URL, '_blank', 'noopener');
  });

  ['fProjeto', 'fStatus'].forEach(id => document.getElementById(id).addEventListener('change', render));
  document.getElementById('fBusca').addEventListener('input', render);

  fetch(`${ESTADO_URL}?t=${Date.now()}`)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(estado => {
      registros = Object.values(estado.campanhas || {})
        .sort((a, b) => (b.processado_em || '').localeCompare(a.processado_em || ''));
      if (estado.atualizado_em) {
        document.getElementById('atualizado').textContent = `Atualizado em ${fmtData(estado.atualizado_em)}.`;
      }
      const projetos = [...new Set(registros.map(r => r.projeto))].sort();
      document.getElementById('fProjeto').insertAdjacentHTML('beforeend',
        projetos.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join(''));
      renderKpis();
      render();
    })
    .catch(() => {
      document.getElementById('lista').innerHTML = '<div class="empty">Não foi possível carregar o estado das campanhas.</div>';
    });
</script>
</body>
</html>
