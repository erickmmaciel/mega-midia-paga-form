name: Testes da automação

on:
  push:
    paths: ["automacao/**", ".github/workflows/testes.yml"]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s automacao/tests
